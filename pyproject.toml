[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-subtitle"
dynamic = ["version"]
description = "把视频/音频拖进终端，本地识别语音并导出 SRT 字幕"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zhouyu" }]
keywords = ["subtitle", "srt", "speech-to-text", "whisper", "sensevoice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "sherpa-onnx>=1.13.0",
]

[project.scripts]
auto-subtitle = "auto_subtitle.cli:main"

[tool.setuptools.dynamic]
version = { attr = "auto_subtitle.__version__" }

[tool.setuptools.packages.find]
include = ["auto_subtitle*"]

[tool.setuptools.package-data]
auto_subtitle = ["assets/*.onnx"]
